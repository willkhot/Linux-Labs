<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a9d5d"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b4fc9"/></marker></defs>
<rect width="1000" height="720" fill="#ffffff"/>
<text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#222">Lab 6 - Automating Web Servers with Ansible in AWS</text>
<text x="500" y="56" text-anchor="middle" font-size="13" fill="#666">SSH agent forwarding into an Ansible control node, which configures two Apache web servers over private SSH</text>

<rect x="20" y="90" width="250" height="230" rx="10" fill="#e8f0fe" stroke="#4a7fd4" stroke-width="2"/>
<text x="32" y="110" font-size="13" font-weight="700" fill="#4a7fd4">My laptop (Windows)</text>
<rect x="40" y="122" width="210" height="110" rx="10" fill="#f4f4f4" stroke="#888" stroke-width="2"/>
<text x="145" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#222">PowerShell + ssh-agent</text>
<text x="145" y="166" text-anchor="middle" font-size="12" fill="#444">ssh-add -k &lt;KEY_NAME&gt;.pem</text>
<text x="145" y="184" text-anchor="middle" font-size="12" fill="#444">ssh -A ubuntu@&lt;ansible-node&gt;</text>
<text x="145" y="208" text-anchor="middle" font-size="12" fill="#444">private key never leaves</text>
<text x="145" y="224" text-anchor="middle" font-size="12" fill="#444">the laptop</text>
<rect x="40" y="245" width="210" height="60" rx="10" fill="#f4f4f4" stroke="#888" stroke-width="2"/>
<text x="145" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Browser</text>
<text x="145" y="289" text-anchor="middle" font-size="12" fill="#444">http://&lt;webserver-public-ip&gt;</text>

<rect x="300" y="80" width="680" height="625" rx="10" fill="#fff3e0" stroke="#e08a1e" stroke-width="2"/>
<text x="312" y="100" font-size="13" font-weight="700" fill="#e08a1e">AWS - us-east-1 (N. Virginia)</text>
<rect x="318" y="110" width="636" height="530" rx="10" fill="#f4f4f4" stroke="#888" stroke-width="2" stroke-dasharray="6 4"/>
<text x="330" y="130" font-size="13" font-weight="700" fill="#888">Default VPC - us-east-1d (all three instances share one key pair)</text>

<rect x="340" y="145" width="270" height="235" rx="10" fill="#fff3e0" stroke="#e08a1e" stroke-width="2"/>
<text x="475" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#222">ansible node</text>
<text x="475" y="188" text-anchor="middle" font-size="12" fill="#444">Ubuntu 26.04 - t3.micro - control node</text>
<text x="475" y="206" text-anchor="middle" font-size="12" fill="#444">Ansible core 2.21 + starter repo</text>
<rect x="355" y="218" width="240" height="92" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.5"/>
<text x="367" y="237" font-size="12" font-weight="700" fill="#222">deploy-everything.yml</text>
<text x="367" y="255" font-size="12" fill="#444">common-all: allow SSH, ufw deny rest</text>
<text x="367" y="272" font-size="12" fill="#444">apache-server: apache2, allow 80</text>
<text x="367" y="289" font-size="12" fill="#444">webapp: git clone site to /var/www</text>
<text x="367" y="304" font-size="11" fill="#666">my_inventory = the two private IPs</text>
<rect x="355" y="320" width="240" height="46" rx="8" fill="#fff8d6" stroke="#c9a400" stroke-width="1.5"/>
<text x="475" y="339" text-anchor="middle" font-size="12" fill="#444">SG: ssh-access-outside</text>
<text x="475" y="356" text-anchor="middle" font-size="12" fill="#444">SG: ssh-internal-only</text>

<rect x="700" y="145" width="245" height="165" rx="10" fill="#e6f7ec" stroke="#3a9d5d" stroke-width="2"/>
<text x="822" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#222">webserver1</text>
<text x="822" y="188" text-anchor="middle" font-size="12" fill="#444">Ubuntu 26.04 - t3.micro</text>
<text x="822" y="206" text-anchor="middle" font-size="12" fill="#444">Apache2 + demo website</text>
<text x="822" y="224" text-anchor="middle" font-size="12" fill="#444">ufw: allow 22 and 80 only</text>
<rect x="715" y="240" width="215" height="56" rx="8" fill="#fff8d6" stroke="#c9a400" stroke-width="1.5"/>
<text x="822" y="262" text-anchor="middle" font-size="12" fill="#444">SG: apache-outside</text>
<text x="822" y="280" text-anchor="middle" font-size="12" fill="#444">SG: ssh-internal-only</text>

<rect x="700" y="330" width="245" height="165" rx="10" fill="#e6f7ec" stroke="#3a9d5d" stroke-width="2"/>
<text x="822" y="355" text-anchor="middle" font-size="14" font-weight="700" fill="#222">webserver2</text>
<text x="822" y="373" text-anchor="middle" font-size="12" fill="#444">Ubuntu 26.04 - t3.micro</text>
<text x="822" y="391" text-anchor="middle" font-size="12" fill="#444">Apache2 + demo website</text>
<text x="822" y="409" text-anchor="middle" font-size="12" fill="#444">ufw: allow 22 and 80 only</text>
<rect x="715" y="425" width="215" height="56" rx="8" fill="#fff8d6" stroke="#c9a400" stroke-width="1.5"/>
<text x="822" y="447" text-anchor="middle" font-size="12" fill="#444">SG: apache-outside</text>
<text x="822" y="465" text-anchor="middle" font-size="12" fill="#444">SG: ssh-internal-only</text>

<rect x="340" y="400" width="300" height="150" rx="10" fill="#fff8d6" stroke="#c9a400" stroke-width="2"/>
<text x="490" y="422" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Security groups (inbound)</text>
<text x="352" y="446" font-size="12" font-weight="700" fill="#222">ssh-access-outside</text>
<text x="352" y="462" font-size="12" fill="#444">SSH 22 from my allowed IP range only</text>
<text x="352" y="486" font-size="12" font-weight="700" fill="#222">apache-outside</text>
<text x="352" y="502" font-size="12" fill="#444">HTTP 80 from my allowed IP range only</text>
<text x="352" y="526" font-size="12" font-weight="700" fill="#222">ssh-internal-only</text>
<text x="352" y="542" font-size="12" fill="#444">SSH 22 from members of this same group</text>

<path d="M250,180 L338,180" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="258" y="172" font-size="11" font-weight="700" fill="#555">SSH -A</text>

<path d="M610,200 L698,200" fill="none" stroke="#7b4fc9" stroke-width="2" marker-end="url(#p)"/>
<path d="M610,250 L655,250 L655,400 L698,400" fill="none" stroke="#7b4fc9" stroke-width="2" marker-end="url(#p)"/>
<text x="614" y="190" font-size="11" font-weight="700" fill="#7b4fc9">SSH 22</text>
<text x="614" y="235" font-size="11" fill="#7b4fc9">private IP</text>

<path d="M145,305 L145,670 L968,670 L968,240 L947,240" fill="none" stroke="#3a9d5d" stroke-width="2" marker-end="url(#g)"/>
<path d="M968,420 L947,420" fill="none" stroke="#3a9d5d" stroke-width="2" marker-end="url(#g)"/>
<text x="160" y="692" font-size="12" font-weight="700" fill="#3a9d5d">HTTP 80 to each web server's public IP (apache-outside)</text>

<rect x="340" y="570" width="300" height="50" rx="10" fill="#f4f4f4" stroke="#888" stroke-width="2" stroke-dasharray="6 4"/>
<text x="490" y="592" text-anchor="middle" font-size="13" font-weight="700" fill="#222">All instances terminated after the lab</text>
<text x="490" y="610" text-anchor="middle" font-size="11" fill="#666">web servers have no SSH path from the internet</text>
</svg>
