<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="960" height="400" fill="#ffffff"/>
<text x="480.0" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#222">Lab 4 - One Router, Two Networks</text>
<text x="480.0" y="56" text-anchor="middle" font-size="13" fill="#666">VirtualBox internal networks, router-1 forwards between them</text>
<rect x="30" y="90" width="340" height="210" rx="10" fill="#f3e8ff" stroke="#8a4fd4" stroke-width="2"/>
<text x="42" y="110" font-size="13" font-weight="700" fill="#8a4fd4">network-1 - 192.168.1.0/24</text>
<rect x="60" y="125" width="130" height="80" rx="10" fill="#e6f7ec" stroke="#3a9d5d" stroke-width="2"/>
<text x="125.0" y="153.0" text-anchor="middle" font-size="14" font-weight="700" fill="#222">machine-A</text>
<text x="125.0" y="170.0" text-anchor="middle" font-size="12" fill="#444">192.168.1.2</text>
<text x="125.0" y="187.0" text-anchor="middle" font-size="12" fill="#444">gw 192.168.1.1</text>
<rect x="210" y="125" width="130" height="80" rx="10" fill="#e6f7ec" stroke="#3a9d5d" stroke-width="2"/>
<text x="275.0" y="153.0" text-anchor="middle" font-size="14" font-weight="700" fill="#222">machine-B</text>
<text x="275.0" y="170.0" text-anchor="middle" font-size="12" fill="#444">192.168.1.3</text>
<text x="275.0" y="187.0" text-anchor="middle" font-size="12" fill="#444">gw 192.168.1.1</text>
<rect x="60" y="240" width="280" height="30" rx="10" fill="#f4f4f4" stroke="#888" stroke-width="2" stroke-dasharray="6 4"/>
<text x="200.0" y="260.0" text-anchor="middle" font-size="14" font-weight="700" fill="#222">VBox Internal Network: network-1</text>
<line x1="125" y1="205" x2="125" y2="240" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="275" y1="205" x2="275" y2="240" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="410" y="180" width="150" height="150" rx="10" fill="#ffe8e8" stroke="#d44a4a" stroke-width="2"/>
<text x="485.0" y="234.5" text-anchor="middle" font-size="14" font-weight="700" fill="#222">router-1</text>
<text x="485.0" y="251.5" text-anchor="middle" font-size="12" fill="#444">IP forwarding = 1</text>
<text x="485.0" y="268.5" text-anchor="middle" font-size="12" fill="#444">enp0s3 192.168.1.1/24</text>
<text x="485.0" y="285.5" text-anchor="middle" font-size="12" fill="#444">enp0s8 192.168.2.1/24</text>
<rect x="590" y="90" width="340" height="210" rx="10" fill="#f3e8ff" stroke="#8a4fd4" stroke-width="2"/>
<text x="602" y="110" font-size="13" font-weight="700" fill="#8a4fd4">network-2 - 192.168.2.0/24</text>
<rect x="695" y="125" width="130" height="80" rx="10" fill="#e6f7ec" stroke="#3a9d5d" stroke-width="2"/>
<text x="760.0" y="153.0" text-anchor="middle" font-size="14" font-weight="700" fill="#222">machine-C</text>
<text x="760.0" y="170.0" text-anchor="middle" font-size="12" fill="#444">192.168.2.2</text>
<text x="760.0" y="187.0" text-anchor="middle" font-size="12" fill="#444">gw 192.168.2.1</text>
<rect x="620" y="240" width="280" height="30" rx="10" fill="#f4f4f4" stroke="#888" stroke-width="2" stroke-dasharray="6 4"/>
<text x="760.0" y="260.0" text-anchor="middle" font-size="14" font-weight="700" fill="#222">VBox Internal Network: network-2</text>
<line x1="760" y1="205" x2="760" y2="240" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="340" y1="255" x2="410" y2="255" stroke="#555" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
<line x1="560" y1="255" x2="620" y2="255" stroke="#555" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="480" y="375" text-anchor="middle" font-size="12" fill="#444">A to C: default route to 192.168.1.1, router-1 forwards out enp0s8, machine-C replies the same way back</text>
