<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="900" height="470" fill="#ffffff"/>
<text x="450.0" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#222">Lab 1 - Deploy Linux Servers</text>
<text x="450.0" y="56" text-anchor="middle" font-size="13" fill="#666">Local VirtualBox VM + AWS EC2 instance reached over SSH</text>
<rect x="30" y="80" width="360" height="360" rx="10" fill="#e8f0fe" stroke="#4a7fd4" stroke-width="2"/>
<text x="42" y="100" font-size="13" font-weight="700" fill="#4a7fd4">Windows host</text>
<rect x="60" y="115" width="300" height="120" rx="10" fill="#e6f7ec" stroke="#3a9d5d" stroke-width="2"/>
<text x="210.0" y="154.5" text-anchor="middle" font-size="14" font-weight="700" fill="#222">VirtualBox VM</text>
<text x="210.0" y="171.5" text-anchor="middle" font-size="12" fill="#444">ubuntu-server-1</text>
<text x="210.0" y="188.5" text-anchor="middle" font-size="12" fill="#444">Ubuntu Server, sudo user</text>
<text x="210.0" y="205.5" text-anchor="middle" font-size="12" fill="#444">Skip Unattended Install</text>
<rect x="60" y="290" width="300" height="120" rx="10" fill="#f4f4f4" stroke="#888" stroke-width="2"/>
<text x="210.0" y="338.0" text-anchor="middle" font-size="14" font-weight="700" fill="#222">PowerShell / OpenSSH client</text>
<text x="210.0" y="355.0" text-anchor="middle" font-size="12" fill="#444">~/.ssh/&lt;KEY_NAME&gt;.pem</text>
<text x="210.0" y="372.0" text-anchor="middle" font-size="12" fill="#444">ssh -i key ec2-user@&lt;DNS&gt;</text>
<rect x="490" y="80" width="380" height="360" rx="10" fill="#fff3e0" stroke="#e08a1e" stroke-width="2"/>
<text x="502" y="100" font-size="13" font-weight="700" fill="#e08a1e">AWS - us-east-1 (N. Virginia)</text>
<rect x="510" y="110" width="340" height="320" rx="10" fill="#f4f4f4" stroke="#888" stroke-width="2" stroke-dasharray="6 4"/>
<text x="522" y="130" font-size="13" font-weight="700" fill="#888">Default VPC - us-east-1a</text>
<rect x="530" y="140" width="300" height="70" rx="10" fill="#fff8d6" stroke="#c9a400" stroke-width="2"/>
<text x="680.0" y="163.0" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Security Group</text>
<text x="680.0" y="180.0" text-anchor="middle" font-size="12" fill="#444">Inbound: SSH TCP 22 from my IP /32</text>
<text x="680.0" y="197.0" text-anchor="middle" font-size="12" fill="#444">Outbound: all (default)</text>
<rect x="530" y="245" width="300" height="95" rx="10" fill="#fff3e0" stroke="#e08a1e" stroke-width="2"/>
<text x="680.0" y="280.5" text-anchor="middle" font-size="14" font-weight="700" fill="#222">EC2 instance - t3.micro</text>
<text x="680.0" y="297.5" text-anchor="middle" font-size="12" fill="#444">Amazon Linux 2023 (Free Tier)</text>
<text x="680.0" y="314.5" text-anchor="middle" font-size="12" fill="#444">user: ec2-user, RSA .pem key pair</text>
<rect x="530" y="360" width="300" height="55" rx="10" fill="#f4f4f4" stroke="#888" stroke-width="2" stroke-dasharray="6 4"/>
<text x="680.0" y="384.0" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Terminated after the lab</text>
<text x="680.0" y="401.0" text-anchor="middle" font-size="12" fill="#444">(no lingering resources)</text>
<line x1="680" y1="210" x2="680" y2="245" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="360" y1="350" x2="530" y2="300" stroke="#555" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="445" y="335" text-anchor="middle" font-size="11.5" fill="#333" stroke="#fff" stroke-width="4" paint-order="stroke">SSH :22</text>
<text x="445" y="349" text-anchor="middle" font-size="11.5" fill="#333" stroke="#fff" stroke-width="4" paint-order="stroke">key auth</text>
</svg>